<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ks-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#ks-gradient)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Open Book Symbol (representing Knowledge) -->
  <path
    d="M14 42.5C18.5 40 25.5 40 32 44C38.5 40 45.5 40 50 42.5V23.5C45.5 21 38.5 21 32 25C25.5 21 18.5 21 14 23.5V42.5Z"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M32 25V44"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Scout Intelligence Spark / Compass Star (representing Scout & AI) -->
  <path
    d="M32 10L33.8 14.2L38 16L33.8 17.8L32 22L30.2 17.8L26 16L30.2 14.2L32 10Z"
    fill="url(#sparkle-grad)"
    filter="url(#glow)"
  />
</svg>
